version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: querybox-postgres
    environment:
      POSTGRES_USER: querybox
      POSTGRES_PASSWORD: querybox_dev_2024
      POSTGRES_DB: querybox_core
    ports:
      - "5432:5432"
    volumes:
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
      - querybox_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U querybox -d querybox_core"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - querybox-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: querybox-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@querybox.dev
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - querybox-network
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/pgadmin-servers.json:/pgadmin4/servers.json:ro
      - ./pgadmin/pgpassfile:/tmp/pgpassfile:ro

  redis:
    image: redis:7-alpine
    container_name: querybox-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - querybox-network

  minio:
    image: minio/minio:latest
    container_name: querybox-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - querybox-network

  # Development storage service (Day 3, Step 5)
  # Provides persistent local storage for development
  storage-dev:
    image: alpine:latest
    container_name: querybox-storage-dev
    command: tail -f /dev/null  # Keep container running
    volumes:
      # Mount host storage directory for persistence across container restarts
      - ../storage:/app/storage
      # Mount temp directory for temporary files
      - storage_temp:/app/storage/_temp
      # Mount logs directory for storage operation logs
      - storage_logs:/app/logs
    environment:
      - STORAGE_PATH=/app/storage
      - TEMP_RETENTION_DAYS=7
    networks:
      - querybox-network
    labels:
      - "querybox.service=storage"
      - "querybox.environment=development"
      - "querybox.description=Local storage persistence for development"

volumes:
  querybox_postgres_data:
  pgadmin_data:
  redis_data:
  minio_data:
  # Storage volumes for development persistence (Day 3, Step 5)
  storage_temp:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ../storage/_temp
  storage_logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ../logs/storage

networks:
  querybox-network:
    driver: bridge