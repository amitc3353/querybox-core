version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: querybox-postgres
    environment:
      POSTGRES_USER: querybox
      POSTGRES_PASSWORD: querybox_dev_2024
      POSTGRES_DB: querybox_core
    ports:
      - "5432:5432"
    volumes:
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
      - querybox_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U querybox -d querybox_core"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - querybox-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: querybox-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@querybox.local
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - querybox-network
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  redis:
    image: redis:7-alpine
    container_name: querybox-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - querybox-network

  minio:
    image: minio/minio:latest
    container_name: querybox-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - querybox-network

volumes:
  querybox_postgres_data:
  pgadmin_data:
  redis_data:
  minio_data:

networks:
  querybox-network:
    driver: bridge